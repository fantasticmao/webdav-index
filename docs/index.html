<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebDAV Index</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>

<body>
  <nav class="navbar navbar-expand navbar-light bg-white border-bottom sticky-top">
    <div class="container-fluid px-3 px-md-4">
      <span class="navbar-brand mb-0 h1 fs-5">WebDAV Index</span>
      <div class="dropdown d-none" id="nav-session">
        <button type="button"
          class="btn btn-link btn-sm text-secondary text-decoration-none dropdown-toggle text-truncate nav-host-btn"
          id="nav-host-btn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Server menu">
          <span id="nav-host"></span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end nav-host-menu" aria-labelledby="nav-host-btn">
          <li>
            <button type="button" class="dropdown-item" id="btn-signout">Sign out</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-3 px-md-4 py-3">
    <nav aria-label="breadcrumb" id="breadcrumb-nav" class="mb-3 d-none">
      <ol class="breadcrumb mb-0" id="breadcrumb"></ol>
    </nav>

    <div id="status-area" class="d-none" role="status"></div>

    <div id="listing-area" class="d-none">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 listing-table">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col" class="col-mtime">Last Modified</th>
              <th scope="col" class="col-size text-end">Size</th>
            </tr>
          </thead>
          <tbody id="listing-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Connect Modal -->
  <div class="modal fade" id="connect-modal" tabindex="-1" aria-labelledby="connect-modal-title" aria-hidden="true"
    data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="connect-form" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="connect-modal-title">Connect to WebDAV</h5>
          </div>
          <div class="modal-body">
            <p class="text-muted small mb-3" id="connect-hint">
              Enter the WebDAV URL and credentials to browse directories.
            </p>
            <div class="mb-3">
              <label for="input-webdav-url" class="form-label">WebDAV URL</label>
              <input type="url" class="form-control" id="input-webdav-url" name="url"
                placeholder="https://dav.example.com/files/" required autocomplete="url">
              <div class="invalid-feedback">Please enter a valid http(s) URL</div>
            </div>
            <div class="mb-3">
              <label for="input-username" class="form-label">Username</label>
              <input type="text" class="form-control" id="input-username" name="username" required
                autocomplete="username">
              <div class="invalid-feedback">Please enter a username</div>
            </div>
            <div class="mb-0">
              <label for="input-password" class="form-label">Password</label>
              <input type="password" class="form-control" id="input-password" name="password" required
                autocomplete="current-password">
              <div class="invalid-feedback">Please enter a password</div>
            </div>
            <div class="alert alert-danger mt-3 mb-0 d-none" id="connect-error" role="alert"></div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary" id="btn-connect">
              <span class="spinner-border spinner-border-sm me-1 d-none" id="connect-spinner" aria-hidden="true"></span>
              Connect
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>

</html>
