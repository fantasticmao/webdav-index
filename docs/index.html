<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="fantasticmao">
    <title>WebDAV Index</title>
    <meta name="description"
        content="A local-first web application for WebDAV client, access remote files and directories, then renders them as read-only file lists.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/module.esm.min.js"
        integrity="sha384-/ScVe6teacTo03ljvt258+VmldZx42Nik1Zk6GBVnfF6n04kCyEx7i3wsWD1g78o" crossorigin="anonymous" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.15.12/dist/module.esm.min.js"
        integrity="sha384-EwIc8k9laTdr6ptryRl5E2VE1Qx4psLlGqZGyrOeG4uIcOX/xjRSpNXZ1IUh1bnB" crossorigin="anonymous" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/webdav@5.10.0/dist/web/index.js"
        integrity="sha384-jA0ZEVHvzHglub9HHaD1lcLnJSfXbHmF3ob0icTH8T6WxiRuLV94rQWuA1/Arn8k" crossorigin="anonymous" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pretty-bytes@7.1.1/index.js"
        integrity="sha384-kf7icmuinvJkHQyk9s6thyk5sg/byAieoxTfSaZL1uvmG1M4+sNNSnGcKmf5Ohl7" crossorigin="anonymous" />
    <script>
        (() => {
            const stored = localStorage.getItem("webdav-index:theme");
            const dark = stored
                ? stored === "dark"
                : matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
        })();
    </script>
</head>

<body class="bg-body-tertiary" x-data="app">
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
        <symbol id="icon-folder" viewBox="0 0 16 16">
            <path
                d="M9.828 3h3.982a2 2 0 0 1 1.992 2.181l-.637 7A2 2 0 0 1 13.174 14H2.825a2 2 0 0 1-1.991-1.819l-.637-7a2 2 0 0 1 .342-1.31L.5 3a2 2 0 0 1 2-2h3.672a2 2 0 0 1 1.414.586l.828.828A2 2 0 0 0 9.828 3m-8.322.12q.322-.119.684-.12h5.396l-.707-.707A1 1 0 0 0 6.172 2H2.5a1 1 0 0 0-1 .981z" />
        </symbol>
        <symbol id="icon-file" viewBox="0 0 16 16">
            <path
                d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5z" />
        </symbol>
        <symbol id="icon-sun" viewBox="0 0 16 16">
            <path
                d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708" />
        </symbol>
        <symbol id="icon-moon" viewBox="0 0 16 16">
            <path
                d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278" />
            <path
                d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.73 1.73 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.73 1.73 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.73 1.73 0 0 0 1.097-1.097zM13.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.16 1.16 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.16 1.16 0 0 0-.732-.732l-.774-.258a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732z" />
        </symbol>
        <symbol id="icon-github" viewBox="0 0 16 16">
            <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8" />
        </symbol>
    </svg>

    <nav class="navbar navbar-expand bg-body border-bottom sticky-top">
        <div class="container px-3 px-md-4">
            <span class="navbar-brand mb-0 fs-5 fw-semibold">WebDAV Index</span>
            <div class="navbar-actions d-flex align-items-center gap-2 ms-auto">
                <div class="dropdown" x-show="baseUrl" x-cloak>
                    <button type="button"
                        class="btn btn-sm btn-link text-body-secondary text-decoration-none dropdown-toggle text-truncate mw-100"
                        id="nav-host-btn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Server menu">
                        <span x-text="baseUrl"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end host-menu" aria-labelledby="nav-host-btn">
                        <template x-for="host in sortedHosts" :key="host">
                            <li>
                                <button type="button" class="dropdown-item text-truncate"
                                    :class="{ active: host === baseUrl }" :title="host" @click="switchHost(host)"
                                    x-text="host"></button>
                            </li>
                        </template>
                        <li>
                            <hr class="dropdown-divider" />
                        </li>
                        <li>
                            <button type="button" class="dropdown-item" @click="openConnectAnother()">
                                Connect another
                            </button>
                        </li>
                        <li>
                            <button type="button" class="dropdown-item" @click="signOut()">Sign out</button>
                        </li>
                    </ul>
                </div>
                <a class="btn btn-sm btn-link text-body-secondary text-decoration-none d-inline-flex align-items-center gap-1"
                    href="https://github.com/fantasticmao/webdav-index" target="_blank" rel="noopener noreferrer"
                    title="View source on GitHub" aria-label="View source on GitHub">
                    <svg class="app-icon" aria-hidden="true">
                        <use href="#icon-github" />
                    </svg>
                </a>
                <button type="button" class="btn btn-sm btn-link text-body-secondary text-decoration-none" x-cloak
                    :aria-label="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
                    @click="toggleTheme()">
                    <svg class="app-icon" aria-hidden="true">
                        <use :href="theme === 'dark' ? '#icon-sun' : '#icon-moon'" />
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="container px-3 px-md-4 py-3">
        <div class="card overflow-hidden shadow-sm" x-show="baseUrl" x-cloak>
            <div class="card-header bg-body-tertiary py-2">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0 small">
                        <template x-for="crumb in crumbs" :key="crumb.path">
                            <li class="breadcrumb-item" :class="{ active: crumb.isLast }"
                                :aria-current="crumb.isLast ? 'page' : false">
                                <template x-if="crumb.isLast">
                                    <span x-text="crumb.label"></span>
                                </template>
                                <template x-if="!crumb.isLast">
                                    <a class="link-underline link-underline-opacity-0 link-underline-opacity-100-hover"
                                        :href="crumb.href" x-text="crumb.label"
                                        @click.prevent="navigate(crumb.path)"></a>
                                </template>
                            </li>
                        </template>
                    </ol>
                </nav>
            </div>

            <div class="card-body text-center py-5" role="status" x-show="loading" x-cloak>
                <div class="spinner-border text-body-secondary" role="status">
                    <span class="visually-hidden">Loading ......</span>
                </div>
                <div class="mt-2 text-body-secondary small">Loading directory ......</div>
            </div>

            <div class="card-body" x-show="errorMessage" x-cloak>
                <div class="alert alert-danger mb-0" role="alert" x-text="errorMessage"></div>
            </div>

            <div class="table-responsive" x-show="!loading && !errorMessage" x-cloak>
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col" class="col-mtime d-none d-sm-table-cell">Last Modified</th>
                            <th scope="col" class="col-size">Size</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="entry in entries" :key="entry.relativePath">
                            <tr>
                                <td>
                                    <a href="#"
                                        class="d-inline-flex align-items-center text-break link-body-emphasis link-underline-opacity-0 link-underline-opacity-100-hover"
                                        @click.prevent="openEntry(entry)">
                                        <svg :class="`app-icon me-2 ${entry.isCollection ? 'text-warning' : 'text-body-secondary'}`"
                                            aria-hidden="true">
                                            <use :href="entry.isCollection ? '#icon-folder' : '#icon-file'" />
                                        </svg>
                                        <span x-text="entry.isCollection ? `${entry.name}/` : entry.name"></span>
                                    </a>
                                </td>
                                <td class="col-mtime d-none d-sm-table-cell text-nowrap text-body-secondary small"
                                    x-text="formatMtime(entry.lastModified)"></td>
                                <td class="col-size text-nowrap text-body-secondary small"
                                    x-text="entry.isCollection ? '-' : formatSize(entry.size)"></td>
                            </tr>
                        </template>
                        <template x-if="entries.length === 0">
                            <tr>
                                <td colspan="3" class="text-body-secondary text-center py-4">(empty)</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" tabindex="-1" aria-labelledby="connect-modal-title" aria-hidden="true"
        data-bs-backdrop="static" data-bs-keyboard="false" x-ref="connectModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form novalidate x-ref="connectForm" :class="{ 'was-validated': showValidation }"
                    @submit.prevent="connect()">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="connect-modal-title">Connect to WebDAV</h1>
                    </div>
                    <div class="modal-body">
                        <p class="text-body-secondary small mb-3" x-text="connectHint"></p>
                        <div class="mb-3">
                            <label for="input-webdav-url" class="form-label">WebDAV URL</label>
                            <input type="url" class="form-control" id="input-webdav-url" name="url"
                                placeholder="https://webdav.example.com/" required autocomplete="url" x-ref="inputUrl"
                                list="saved-hosts" x-model="form.url" @input="onUrlInput()"
                                @focus="$event.target.select()" />
                            <datalist id="saved-hosts">
                                <template x-for="host in sortedHosts" :key="host">
                                    <option :value="host"></option>
                                </template>
                            </datalist>
                            <div class="invalid-feedback">Please enter a valid http(s) URL</div>
                        </div>
                        <div class="mb-3">
                            <label for="input-username" class="form-label">Username (optional)</label>
                            <input type="text" class="form-control" id="input-username" name="username"
                                autocomplete="username" x-ref="inputUsername" x-model="form.username" />
                        </div>
                        <div class="mb-0">
                            <label for="input-password" class="form-label">Password (optional)</label>
                            <input type="password" class="form-control" id="input-password" name="password"
                                autocomplete="current-password" x-model="form.password" />
                        </div>
                        <div class="alert alert-warning mt-3 mb-0" role="alert" x-show="connectError" x-cloak
                            x-text="connectError">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" x-show="connectCancellable" x-cloak
                            :disabled="connecting" @click="modal.hide()">
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-primary" x-ref="connectSubmit" :disabled="connecting">
                            <span class="spinner-border spinner-border-sm me-1" aria-hidden="true" x-show="connecting"
                                x-cloak></span>
                            Connect
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
