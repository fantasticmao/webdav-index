<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <rect width="16" height="16" rx="3.5" fill="#0d6efd" />
  <!-- Three uneven rows for the directory listing, plus a chevron for stepping into the next
       level. Stroked instead of filled so the lines stay a full pixel wide once the browser
       rasterizes this at 16px; the uneven row widths keep it from reading as a hamburger. The
       chevron carries a heavier stroke than the rows because its diagonals lose the most weight
       to antialiasing at that size. -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="1.8">
      <path d="M3 4.7h4.4" />
      <path d="M3 8h2.9" />
      <path d="M3 11.3h3.7" />
    </g>
    <path d="M9.9 4.9 13 8l-3.1 3.1" stroke-width="2.4" />
  </g>
</svg>
